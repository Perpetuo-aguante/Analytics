# Worker del compass editorial (analysis/): analiza en batch los posts con
# texto nuevo o cambiado. Corre martes, jueves y sábado después de las cargas
# automáticas, y a mano desde Actions → "Análisis literario" → Run workflow.
#
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   DATABASE_URL   la misma conexión de Neon que usa la app
#   LLM_API_KEY    clave de la API del LLM (xAI por defecto)
# Variables opcionales (pestaña Variables): LLM_MODEL, LLM_BASE_URL.
name: Análisis literario

on:
  schedule:
    - cron: "17 16 * * 2,4,6" # 10:17 en Ciudad de México
  workflow_dispatch:
    inputs:
      capas:
        description: "Capas (estilometria,afecto,literario)"
        default: "estilometria,afecto,literario"
      slug:
        description: "Solo este post (opcional)"
        required: false
      limite:
        description: "Máximo de posts en esta corrida (opcional)"
        required: false
      forzar:
        description: "Re-analizar aunque nada haya cambiado"
        type: boolean
        default: false

concurrency:
  group: analisis-literario
  cancel-in-progress: false

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - name: Dependencias
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          python -m spacy download es_core_news_lg
      - name: Modelos de pysentimiento (caché)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-pysentimiento-v1
      - name: Analizar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
        run: |
          [ -z "$LLM_MODEL" ] && unset LLM_MODEL
          [ -z "$LLM_BASE_URL" ] && unset LLM_BASE_URL
          args=(run --capas "${{ inputs.capas || 'estilometria,afecto,literario' }}")
          [ -n "${{ inputs.slug }}" ] && args+=(--slug "${{ inputs.slug }}")
          [ -n "${{ inputs.limite }}" ] && args+=(--limite "${{ inputs.limite }}")
          [ "${{ inputs.forzar }}" = "true" ] && args+=(--forzar)
          python -m perpetuo_analysis "${args[@]}"
